<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامه مکالمه صوتی دو نفره</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f9;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            margin: 10px;
        }
        button:disabled {
            background-color: #ccc;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>مکالمه صوتی دو نفره (WebRTC)</h1>
    <button id="startButton">شروع تماس</button>
    <div id="status">در حال انتظار برای اقدام شما...</div>

    <!-- تگ صدا برای پخش صدای طرف مقابل -->
    <audio id="remoteAudio" autoplay></audio>

    <script>
        const startButton = document.getElementById('startButton');
        const statusDiv = document.getElementById('status');
        const remoteAudio = document.getElementById('remoteAudio');

        let localStream;
        let peerConnection;
        let socket;

        // تنظیمات سرورهای عمومی STUN گوگل برای پیدا کردن IPهای عمومی در اینترنت
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        startButton.addEventListener('click', startCall);

        async function startCall() {
            startButton.disabled = true;
            statusDiv.innerText = "در حال اتصال به سرور سیگنالینگ...";

            // ۱. اتصال به سرور WebSocket
            // توجه: برای تست روی اینترنت، آدرس localhost را با IP سرور خود عوض کنید (مثلاً ws://YOUR_SERVER_IP:8080)
            socket = new WebSocket('wss://rouzgame.ir/ws-voice/');

            socket.onopen = async () => {
                statusDiv.innerText = "متصل شد. در حال دسترسی به میکروفون...";
                try {
                    // ۲. گرفتن دسترسی به میکروفون کاربر
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    statusDiv.innerText = "دسترسی به میکروفون برقرار شد. آماده برقراری تماس...";
                    
                    // ایجاد ساختار WebRTC Peer Connection
                    setupPeerConnection();
                } catch (err) {
                    statusDiv.innerText = "خطا در دسترسی به میکروفون: " + err.message;
                }
            };

            socket.onmessage = async (event) => {
                const data = JSON.parse(event.data);

                if (data.offer) {
                    statusDiv.innerText = "دریافت تماس...";
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    socket.send(JSON.stringify({ answer }));
                } 
                else if (data.answer) {
                    statusDiv.innerText = "تماس برقرار شد!";
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                } 
                else if (data.candidate) {
                    try {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                    } catch (e) {
                        console.error("خطا در افزودن ICE Candidate", e);
                    }
                }
            };
        }

        function setupPeerConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);

            // اضافه کردن ترک‌های صوتی خودمان به اتصال
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            // وقتی صدای طرف مقابل دریافت شد، آن را پخش کن
            peerConnection.ontrack = (event) => {
                remoteAudio.srcObject = event.streams[0];
                statusDiv.innerText = "مکالمه فعال است (صدا متصل شد)";
            };

            // پیدا کردن مسیرهای بهینه شبکه (ICE Candidates) و فرستادن آن‌ها به طرف مقابل
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.send(JSON.stringify({ candidate: event.candidate }));
                }
            };

            // ارسال اولین پیشنهاد (Offer) توسط کسی که دکمه را اول فشار می‌دهد
            createOffer();
        }

        async function createOffer() {
            try {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.send(JSON.stringify({ offer }));
                statusDiv.innerText = "در حال زنگ خوردن / انتظار برای اتصال همتا...";
            } catch (e) {
                console.error("خطا در ساخت Offer", e);
            }
        }
    </script>
</body>
</html>
