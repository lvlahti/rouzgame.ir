<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>rouzgame_city</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<div id="toast" class="toast"></div>
<body>

  <div class="cloud c1">
    <div class="eyes">
      <span class="eye"><i></i></span>
      <span class="eye"><i></i></span>
    </div>
  </div>

  <div class="cloud c2">
    <div class="eyes">
      <span class="eye"><i></i></span>
      <span class="eye"><i></i></span>
    </div>
  </div>

  <div class="cloud c3">
    <div class="eyes">
      <span class="eye"><i></i></span>
      <span class="eye"><i></i></span>
    </div>
  </div>

  <div class="games">

    <!-- باکس وضعیت سرور -->
    <div class="game-btn server-box">
      <h3> شهر ماجراجویی </h3>
      <!-- <div class="server-ip" id="serverIp">
        mc.rouzgame.ir
      </div> -->
    <button class="ip-btn" id="serverIp" type="button">
      <span class="ip-text">mc.rouzgame.ir</span>
      <span class="ip-text">:server address</span>
    </button>

    
      <div class="server-status">
        <span class="status-dot" id="statusDot"></span>
        <span id="serverStatus">در حال بررسی...</span>
      </div>
    
      <div id="playerCount" class="player-count"></div>
    </div>

  
    <!-- باکس پلیرها (جدا) -->
    <div class="game-btn players-box">

      <div class="players-header">
        <button id="toggleOfflineBtn" class="toggle-btn" type="button">
          نمایش آفلاین‌ها
        </button>
      </div>
    
      <!-- <div id="playerCount" class="player-count"></div> -->
      <div id="playerList" class="player-list"></div>
    
      <div id="offlineWrap" class="offline-wrap hidden">
        <div class="offline-title">بازیکن‌های آفلاین</div>
        <div id="offlineList" class="player-list"></div>
      </div>
    
    </div>
    
  
  </div>

  <!-- <footer>
    <a href="https://rouzgame.ir" class="footer-link">روزگیم</a>
  </footer> -->


  <script src="main.js"></script>
</body>
</html>
